config:
  validation: true

complexity:
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 20
    allowedFunctionsPerObject: 20
    ignorePrivate: true
    ignoreOverridden: true

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    ignoreEnums: true
    ignorePropertyDeclaration: true
  ReturnCount:
    max: 3
    excludeGuardClauses: true

ktlint:
  BlankLineBetweenWhenConditions:
    active: false
  ClassSignature:
    active: false
  FunctionExpressionBody:
    active: false
  FunctionSignature:
    active: false
  MaximumLineLength:
    active: false

Compose:
  CompositionLocalAllowlist:
    allowedCompositionLocals: ['LocalPaneChrome']
  ParameterNaming:
    active: false
